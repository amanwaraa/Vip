<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة ديون الزبائن</title>

  <link rel="manifest" href="./manifest-fee.json" />
  <meta name="theme-color" content="#dbeafe" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');

    :root{
      --primary:#1d4ed8;
      --primary-2:#2563eb;
      --danger:#dc2626;
      --success:#16a34a;
      --warning:#f59e0b;
      --dark:#0f172a;
      --muted:#64748b;
      --bg:#f8fafc;
      --card:#ffffff;
      --border:#e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37,99,235,.08), transparent 25%),
        radial-gradient(circle at top left, rgba(16,185,129,.07), transparent 25%),
        var(--bg);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      color: var(--dark);
    }

    .glass-header {
      background: rgba(239, 246, 255, 0.96);
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 28px rgba(15,23,42,.10);
      border-bottom: 1px solid rgba(191,219,254,.95);
    }

    .bottom-nav {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(14px);
      box-shadow: 0 -8px 24px rgba(15,23,42,.08);
      border-top: 1px solid rgba(226,232,240,.9);
    }

    .fancy-card {
      background: rgba(255,255,255,.84);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: 0 10px 30px rgba(15,23,42,.06);
    }

    .card-shadow {
      box-shadow: 0 18px 40px rgba(15,23,42,.10);
    }

    .btn {
      transition: all .18s ease;
      transform: translateY(0);
    }
    .btn:active {
      transform: scale(.98);
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
      font-size: 14px;
      transition: .18s ease;
    }
    .input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96,165,250,.18);
    }

    .select {
      width: 100%;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
      font-size: 14px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.48);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn .18s ease;
    }

    .modal-panel {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto;
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(15,23,42,.22);
      animation: slideUp .18s ease;
    }

    .toast-wrap {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: rgba(15,23,42,.93);
      color: #fff;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 14px 40px rgba(2,6,23,.28);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: slideDown .18s ease;
    }

    .toast.success { background: rgba(22,163,74,.96); }
    .toast.error { background: rgba(220,38,38,.96); }
    .toast.warning { background: rgba(245,158,11,.97); color:#111827; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-red { background: rgba(239,68,68,.12); color: #dc2626; }
    .badge-green { background: rgba(34,197,94,.12); color: #15803d; }
    .badge-blue { background: rgba(59,130,246,.12); color: #1d4ed8; }
    .badge-yellow { background: rgba(245,158,11,.12); color: #b45309; }
    .badge-slate { background: rgba(100,116,139,.12); color: #334155; }

    .stat-tile {
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.92));
      border: 1px solid rgba(226,232,240,.85);
      border-radius: 24px;
      box-shadow: 0 10px 24px rgba(15,23,42,.05);
    }

    .fab-main {
      position: fixed;
      left: 18px;
      bottom: 86px;
      z-index: 40;
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      box-shadow: 0 18px 40px rgba(37,99,235,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
    }

    .table-modern {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .table-modern th, .table-modern td {
      padding: 10px;
      border-bottom: 1px solid #eef2f7;
      text-align: right;
      vertical-align: top;
    }
    .table-modern th {
      background: #f8fafc;
      color: #334155;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(180deg, #eff6ff 0%, #f8fbff 100%);
    }

    .hidden-force { display: none !important; }

    .rights-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 16px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      color: #1e3a8a;
      text-align: center;
      font-size: 13px;
      line-height: 1.9;
      font-weight: 700;
    }

    ::-webkit-scrollbar { width: 7px; height:7px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(12px) scale(.985); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes slideDown {
      from { transform: translateY(-8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media print {
      body { background: #fff !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="pb-24">

  <div id="loginRoot" class="login-shell">
    <div class="fancy-card w-full max-w-md rounded-[28px] p-6">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl font-extrabold shadow-lg">₪</div>
        <h2 class="text-2xl font-extrabold text-slate-800 mt-4">تسجيل الدخول</h2>
        <p class="text-sm text-slate-500 mt-2">أول دخول يحتاج اتصال إنترنت، وبعدها يعمل التطبيق أوفلاين</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">مفتاح الدخول</label>
          <input id="licenseKeyInput" type="text" class="input" placeholder="أدخل المفتاح...">
        </div>

        <div id="loginStatusBox" class="hidden text-sm rounded-xl p-3"></div>

        <button id="loginBtn" class="w-full btn bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-extrabold shadow-lg">دخول</button>

        <div class="rights-box">
          هذا التطبيق يستخدم مسار مفاتيح مستقل<br>
          fee_licenses
        </div>

        <div class="text-xs text-center text-slate-400">
          مفاتيح التطبيق السابق لا تعمل هنا
        </div>
      </div>
    </div>
  </div>

  <div id="expiredRoot" class="login-shell hidden-force">
    <div class="fancy-card w-full max-w-md rounded-[28px] p-6 text-center">
      <div class="w-16 h-16 mx-auto rounded-full bg-red-100 flex items-center justify-center mb-4">
        <span class="text-3xl text-red-600">!</span>
      </div>
      <h2 id="expiredTitle" class="text-2xl font-extrabold text-red-700 mb-3">انتهى الاشتراك</h2>
      <p id="expiredText" class="text-sm text-slate-600 leading-8 mb-5">يرجى إدخال مفتاح صالح للمتابعة.</p>
      <button id="goToLoginBtn" class="w-full btn bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-extrabold shadow-lg">العودة لتسجيل الدخول</button>
    </div>
  </div>

  <div id="appRoot" class="hidden-force">
    <div id="toast-root" class="toast-wrap no-print"></div>
    <div id="modal-root"></div>

    <header class="glass-header sticky top-0 z-50 text-slate-800 p-4 flex justify-between items-center no-print">
      <div class="flex items-center gap-3 min-w-0">
        <div id="shop-logo-container" class="w-11 h-11 bg-white rounded-2xl overflow-hidden flex items-center justify-center shadow-lg shrink-0">
          <i class="fas fa-store text-blue-800" id="default-icon"></i>
          <img id="header-logo" class="hidden w-full h-full object-cover">
        </div>
        <div class="min-w-0">
          <h1 id="header-shop-name" class="font-extrabold text-lg leading-tight truncate">سوبر ماركت</h1>
          <span class="text-xs text-slate-500">نظام إدارة الديون والفواتير</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openAlertsModal()" class="p-2 hover:bg-blue-100 rounded-full transition-colors relative">
          <i class="fas fa-bell text-xl"></i>
          <span id="alerts-badge" class="hidden absolute -top-1 -left-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center">0</span>
        </button>
        <button onclick="navigate('settings')" class="p-2 hover:bg-blue-100 rounded-full transition-colors">

    <main id="app-container" class="p-4 max-w-3xl mx-auto"></main>

    <button class="fab-main no-print btn" onclick="openQuickActions()">
      <i class="fas fa-plus text-xl"></i>
    </button>

    <nav class="bottom-nav fixed bottom-0 left-0 right-0 flex justify-around p-2 no-print">
      <button onclick="navigate('home')" class="flex flex-col items-center p-2 text-blue-600 nav-btn" id="nav-home">
        <i class="fas fa-home text-xl"></i>
        <span class="text-[10px] mt-1">الرئيسية</span>
      </button>
      <button onclick="navigate('customers')" class="flex flex-col items-center p-2 text-gray-500 nav-btn" id="nav-customers">
        <i class="fas fa-users text-xl"></i>
        <span class="text-[10px] mt-1">الزبائن</span>
      </button>
      <button onclick="navigate('reports')" class="flex flex-col items-center p-2 text-gray-500 nav-btn" id="nav-reports">
        <i class="fas fa-file-invoice-dollar text-xl"></i>
        <span class="text-[10px] mt-1">التقارير</span>
      </button>
      <button onclick="navigate('settings')" class="flex flex-col items-center p-2 text-gray-500 nav-btn" id="nav-settings">
        <i class="fas fa-user-shield text-xl"></i>
        <span class="text-[10px] mt-1">الإعدادات</span>
      </button>
    </nav>

    <div id="capture-root" class="fixed -left-[99999px] top-0 w-[1000px] bg-white"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    window.feeFirebase = {
      initializeApp,
      getDatabase,
      ref,
      get,
      update
    };
  </script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCnLAY7zQyBy7gUuL9wszt9aEhiJgvRmxI",
      authDomain: "shop-d52dc.firebaseapp.com",
      databaseURL: "https://shop-d52dc-default-rtdb.firebaseio.com",
      projectId: "shop-d52dc",
      storageBucket: "shop-d52dc.appspot.com",
      messagingSenderId: "97580537866",
      appId: "1:97580537866:web:abc46e5a2f527b6300a7f3",
      measurementId: "G-956RQMBP42"
    };

    const LICENSE_CACHE_KEY = "fee_cached_license_state_v1";
    const INSTALLATION_ID_KEY = "fee_installation_id_v1";
    const LICENSE_PATH = "fee_licenses";

    let firebaseAppRef = null;
    let firebaseDbRef = null;
    let licenseCountdownInterval = null;

    const DEFAULT_SETTINGS = {
      shopName: 'سوبر ماركت الياسمين',
      logo: null,
      currency: 'شيكل',
      defaultCreditLimit: 500,
      overdueDaysThreshold: 14,
      shopPhone: '',
      shopAddress: '',
      enableOverdueAlerts: true,
      enableCreditLimitAlerts: true
    };

    let state = {
      currentScreen: 'home',
      screenStack: ['home'],
      customers: JSON.parse(localStorage.getItem('debts_customers_v2')) || [],
      settings: { ...DEFAULT_SETTINGS, ...(JSON.parse(localStorage.getItem('debts_settings_v2')) || {}) },
      selectedCustomerId: null,
      filters: {
        type: 'all',
        period: 'all'
      },
      reportFilters: {
        type: 'all',
        period: 'all'
      }
    };

    function uid(prefix = 'id') {
      return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    }

    function formatCurrency(val) {
      const num = Number(val || 0);
      return `${num.toLocaleString('en-US')} ${state.settings.currency}`;
    }

    function formatDate(dateStr, withTime = true) {
      const d = new Date(dateStr);
      return d.toLocaleString('ar-EG', withTime ? {
        year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit'
      } : {
        year:'numeric', month:'2-digit', day:'2-digit'
      });
    }

    function parseNumber(v) {
      const x = parseFloat(v);
      return isNaN(x) ? 0 : x;
    }

    function todayISO() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 16);
    }

    function save() {
      localStorage.setItem('debts_customers_v2', JSON.stringify(state.customers));
      localStorage.setItem('debts_settings_v2', JSON.stringify(state.settings));
    }

    function setShell(target) {
      document.getElementById("loginRoot").classList.add("hidden-force");
      document.getElementById("expiredRoot").classList.add("hidden-force");
      document.getElementById("appRoot").classList.add("hidden-force");

      if (target === "login") document.getElementById("loginRoot").classList.remove("hidden-force");
      if (target === "expired") document.getElementById("expiredRoot").classList.remove("hidden-force");
      if (target === "app") document.getElementById("appRoot").classList.remove("hidden-force");
    }

    function generateRandomId() {
      return "id_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function getInstallationId() {
      let id = localStorage.getItem(INSTALLATION_ID_KEY);
      if (!id) {
        id = generateRandomId();
        localStorage.setItem(INSTALLATION_ID_KEY, id);
      }
      return id;
    }

    function getCachedLicenseState() {
      const raw = localStorage.getItem(LICENSE_CACHE_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    function saveCachedLicenseState(data) {
      localStorage.setItem(LICENSE_CACHE_KEY, JSON.stringify(data));
    }

    function clearCachedLicenseState() {
      localStorage.removeItem(LICENSE_CACHE_KEY);
    }

    function nowMs() {
      return Date.now();
    }

    function formatRemaining(ms) {
      if (ms <= 0) return "0 دقيقة";
      const minute = 60 * 1000, hour = 60 * minute, day = 24 * hour, month = 30 * day, year = 365 * day;
      const years = Math.floor(ms / year); if (years > 0) return `${years} سنة`;
      const months = Math.floor(ms / month); if (months > 0) return `${months} شهر`;
      const days = Math.floor(ms / day); if (days > 0) return `${days} يوم`;
      const hours = Math.floor(ms / hour); if (hours > 0) return `${hours} ساعة`;
      const minutes = Math.max(1, Math.floor(ms / minute));
      return `${minutes} دقيقة`;
    }

    function isLicenseExpired(stateObj) {
      if (!stateObj) return true;
      if (stateObj.isPermanent) return false;
      if (!stateObj.expiresAt) return true;
      return nowMs() >= Number(stateObj.expiresAt);
    }

    function showLoginStatus(message, type = "info") {
      const box = document.getElementById("loginStatusBox");
      box.classList.remove("hidden");
      box.textContent = message;
      box.className = "text-sm rounded-xl p-3";
      if (type === "error") box.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
      else if (type === "success") box.classList.add("bg-green-50", "text-green-700", "border", "border-green-200");
      else box.classList.add("bg-blue-50", "text-blue-700", "border", "border-blue-200");
    }

    function clearLoginStatus() {
      const box = document.getElementById("loginStatusBox");
      box.classList.add("hidden");
      box.textContent = "";
    }

    function showExpiredScreen(stateObj) {
      stopLicenseCountdown();
      const isTrial = stateObj?.planType === "trial";
      document.getElementById("expiredTitle").textContent = isTrial ? "انتهت الفترة التجريبية" : "انتهى الاشتراك";
      document.getElementById("expiredText").textContent = isTrial
        ? "انتهت الفترة التجريبية لهذا التطبيق. يرجى إدخال مفتاح جديد."
        : "انتهت صلاحية المفتاح. يرجى إدخال مفتاح صالح.";
      setShell("expired");
    }

    function stopLicenseCountdown() {
      if (licenseCountdownInterval) {
        clearInterval(licenseCountdownInterval);
        licenseCountdownInterval = null;
      }
    }

    function startLicenseCountdown() {
      stopLicenseCountdown();
      const tick = () => {
        const stateObj = getCachedLicenseState();
        if (!stateObj) return;
        stateObj.isExpired = isLicenseExpired(stateObj);
        saveCachedLicenseState(stateObj);
        if (stateObj.isExpired) showExpiredScreen(stateObj);
      };
      tick();
      licenseCountdownInterval = setInterval(tick, 1000);
    }

    async function ensureFirebaseReady() {
      if (firebaseDbRef) return;
      const fb = window.feeFirebase;
      if (!fb) throw new Error("Firebase not ready");
      firebaseAppRef = fb.initializeApp(firebaseConfig, "fee-app");
      firebaseDbRef = fb.getDatabase(firebaseAppRef);
    }

    async function validateLicenseOnline(key, countLogin = true) {
      const trimmed = String(key || "").trim();
      if (!trimmed) return { ok: false, message: "يرجى إدخال المفتاح" };
      if (!navigator.onLine) return { ok: false, message: "يلزم توفر الإنترنت لأول مرة للتحقق من المفتاح" };

      await ensureFirebaseReady();

      const installationId = getInstallationId();
      const { ref, get, update } = window.feeFirebase;

      try {
        const licenseRef = ref(firebaseDbRef, `${LICENSE_PATH}/${trimmed}`);
        const snapshot = await get(licenseRef);

        if (!snapshot.exists()) return { ok: false, message: "المفتاح غير صالح لهذا التطبيق" };

        const remoteLicense = snapshot.val() || {};
        if (remoteLicense.status !== "active") return { ok: false, message: "هذا المفتاح معطل" };

        const isPermanent = !!remoteLicense.isPermanent;
        const expiresAt = isPermanent ? null : Number(remoteLicense.expiresAt || 0);
        const allowUnlimitedDevices = !!remoteLicense.allowUnlimitedDevices;
        const maxDevices = allowUnlimitedDevices ? null : Number(remoteLicense.maxDevices || 1);

        if (!isPermanent && (!expiresAt || Date.now() >= expiresAt)) {
          return { ok: false, message: "المفتاح منتهي" };
        }

        const loginCount = Number(remoteLicense.loginCount || 0);

        if (countLogin && !allowUnlimitedDevices && loginCount >= maxDevices) {
          return { ok: false, message: "تم استهلاك عدد الأجهزة المسموح لهذا المفتاح" };
        }

        if (countLogin) {
          const historyRef = ref(firebaseDbRef, `${LICENSE_PATH}/${trimmed}/loginHistory/login_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`);
          const updatePayload = {
            lastLoginAt: Date.now(),
            lastInstallationId: installationId
          };

          if (!allowUnlimitedDevices) {
            updatePayload.loginCount = loginCount + 1;
          }

          await update(ref(firebaseDbRef, `${LICENSE_PATH}/${trimmed}`), updatePayload);
          await update(historyRef, {
            installationId,
            loggedAt: Date.now()
          });
        } else {
          await update(ref(firebaseDbRef, `${LICENSE_PATH}/${trimmed}`), {
            lastValidatedAt: Date.now()
          });
        }

        const finalLoginCount = countLogin
          ? (allowUnlimitedDevices ? loginCount : loginCount + 1)
          : loginCount;

        const license = {
          key: trimmed,
          planType: remoteLicense.planType || "regular",
          isPermanent,
          expiresAt,
          issuedAt: remoteLicense.issuedAt || Date.now(),
          activatedAt: remoteLicense.issuedAt || Date.now(),
          cachedAt: Date.now(),
          status: remoteLicense.status || "active",
          installationId,
          maxDevices,
          allowUnlimitedDevices,
          loginCount: finalLoginCount,
          lastValidatedAt: Date.now()
        };

        license.isExpired = isLicenseExpired(license);
        if (license.isExpired) return { ok: false, license, message: "المفتاح منتهي" };

        return { ok: true, license, message: "تم التحقق بنجاح" };
      } catch (error) {
        console.error("License validation error:", error);
        return { ok: false, message: "تعذر الاتصال بقاعدة البيانات" };
      }
    }

    async function refreshLicenseStateIfOnline() {
      const stateObj = getCachedLicenseState();
      if (!stateObj || !stateObj.key || !navigator.onLine) return;

      const result = await validateLicenseOnline(stateObj.key, false);

      if (!result.ok) {
        if (result.message === "هذا المفتاح معطل" || result.message === "المفتاح منتهي") {
          const expiredState = { ...stateObj, isExpired: true, cachedAt: Date.now() };
          saveCachedLicenseState(expiredState);
          showExpiredScreen(expiredState);
        }
        return;
      }

      saveCachedLicenseState(result.license);
      startLicenseCountdown();
    }

    function bootstrapLicenseFlow() {
      const stateObj = getCachedLicenseState();
      if (!stateObj) {
        setShell("login");
        return;
      }

      stateObj.isExpired = isLicenseExpired(stateObj);
      saveCachedLicenseState(stateObj);

      if (stateObj.isExpired) {
        showExpiredScreen(stateObj);
        return;
      }

      setShell("app");
      startLicenseCountdown();
      refreshLicenseStateIfOnline();
    }

    async function handleLogin() {
      const key = document.getElementById("licenseKeyInput").value.trim();
      clearLoginStatus();

      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "جارٍ التحقق...";

      try {
        const result = await validateLicenseOnline(key, true);

        if (!result.ok) {
          showLoginStatus(result.message || "تعذر التحقق من المفتاح", "error");
          return;
        }

        saveCachedLicenseState(result.license);
        showLoginStatus("تم تسجيل الدخول بنجاح", "success");
        setShell("app");
        startLicenseCountdown();
      } finally {
        btn.disabled = false;
        btn.textContent = "دخول";
      }
    }

      title = 'تأكيد العملية',
      message = 'هل أنت متأكد؟',
      confirmText = 'تأكيد',

      type = 'danger',
      onConfirm = () => {}
    }) {
      const color = type === 'danger'
        ? 'bg-red-600 hover:bg-red-700'
        : 'bg-blue-600 hover:bg-blue-700';

      window.__confirmDialogAction = () => {
        try {

      openModal({

        footer: `

            <button onclick="closeModal()" class="btn flex-1 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 font-bold">${cancelText}</button>
            <button onclick="window.__confirmDialogAction && window.__confirmDialogAction()" class="btn flex-1 py-3 rounded-2xl text-white font-bold ${color}">${confirmText}</button>

    function calculateBalance(customer) {
      return (customer.logs || []).reduce((acc, log) => {
        if (log.type === 'debt' || log.type === 'invoice') return acc + Number(log.amount || 0);
        if (log.type === 'payment') return acc - Number(log.amount || 0);
        return acc;
      }, 0);
    }

    function totalDebtsAmount(customer) {
      return (customer.logs || []).filter(l => l.type === 'debt' || l.type === 'invoice')
        .reduce((a, b) => a + Number(b.amount || 0), 0);
    }

    function totalPaymentsAmount(customer) {
      return (customer.logs || []).filter(l => l.type === 'payment')
        .reduce((a, b) => a + Number(b.amount || 0), 0);
    }

    function getCustomerById(id) {
      return state.customers.find(c => c.id === id);
    }

    function getCreditLimit(customer) {
      return Number(customer.creditLimit ?? state.settings.defaultCreditLimit ?? 0);
    }

    function getLastPaymentDate(customer) {
      const payments = (customer.logs || []).filter(l => l.type === 'payment');
      if (!payments.length) return null;
      payments.sort((a,b)=> new Date(b.date) - new Date(a.date));
      return payments[0].date;
    }

    function getDaysSince(dateStr) {
      if (!dateStr) return null;
      const diff = Date.now() - new Date(dateStr).getTime();
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function getOverdueStatus(customer) {
      const balance = calculateBalance(customer);
      if (balance <= 0) return { overdue: false, days: 0 };

      const lastPayment = getLastPaymentDate(customer);
      const oldestDebt = (customer.logs || [])
        .filter(l => l.type === 'debt' || l.type === 'invoice')
        .sort((a,b)=> new Date(a.date)-new Date(b.date))[0];

      const referenceDate = lastPayment || oldestDebt?.date;
      if (!referenceDate) return { overdue: false, days: 0 };

      const days = getDaysSince(referenceDate);
      const overdue = days >= Number(state.settings.overdueDaysThreshold || 14);

      return { overdue, days };
    }

    function getAllAlerts() {
      const alerts = [];

      state.customers.forEach(customer => {
        const balance = calculateBalance(customer);
        const creditLimit = getCreditLimit(customer);

        if (state.settings.enableCreditLimitAlerts && balance > creditLimit && creditLimit > 0) {
          alerts.push({
            type: 'credit',
            severity: 'warning',
            customerId: customer.id,
            title: 'تجاوز الحد الائتماني',
            text: `${customer.name} تجاوز الحد الائتماني. الرصيد ${formatCurrency(balance)} والحد ${formatCurrency(creditLimit)}`
          });
        }

        const overdueInfo = getOverdueStatus(customer);
        if (state.settings.enableOverdueAlerts && overdueInfo.overdue) {
          alerts.push({
            type: 'overdue',
            severity: 'error',
            customerId: customer.id,
            title: 'تأخر في السداد',
            text: `${customer.name} متأخر عن السداد منذ ${overdueInfo.days} يومًا`
          });
        }
      });

      return alerts;
    }

    function updateAlertsBadge() {
      const alerts = getAllAlerts();
      const badge = document.getElementById('alerts-badge');
      if (!badge) return;
      badge.innerText = alerts.length;
      badge.classList.toggle('hidden', alerts.length === 0);

    function filterLogs(logs, filters = state.filters) {
      let filtered = [...(logs || [])];

      if (filters.type !== 'all') {
        filtered = filtered.filter(l => l.type === filters.type);
      }

      if (filters.period !== 'all') {
        const now = new Date();
        filtered = filtered.filter(l => {
          const d = new Date(l.date);
          const diff = now - d;
          if (filters.period === 'today') return d.toDateString() === now.toDateString();
          if (filters.period === 'week') return diff < 7 * 24 * 60 * 60 * 1000;
          if (filters.period === 'month') return diff < 30 * 24 * 60 * 60 * 1000;
          if (filters.period === 'year') return diff < 365 * 24 * 60 * 60 * 1000;
          return true;
        });
      }

      return filtered;
    }

    function getAllTransactions() {
      const rows = [];
      state.customers.forEach(customer => {

          rows.push({

            customerId: customer.id,
            customerName: customer.name,
            customerPhone: customer.phone || '',
            creditLimit: getCreditLimit(customer)
          });
        });
      });
      return rows.sort((a,b)=> new Date(b.date) - new Date(a.date));
    }

    function filterAllTransactions() {
      return filterLogs(getAllTransactions(), state.reportFilters);

    function renderLogCard(customer, log) {
      const typeMap = {
        debt: { text:'دين', cls:'text-red-600', border:'border-red-400', badge:'badge-red', icon:'fa-plus-circle' },
        payment: { text:'سداد', cls:'text-green-600', border:'border-green-400', badge:'badge-green', icon:'fa-hand-holding-dollar' },
        invoice: { text:'فاتورة', cls:'text-blue-600', border:'border-blue-400', badge:'badge-blue', icon:'fa-receipt' }
      };
      const t = typeMap[log.type] || typeMap.debt;

      const note = log.note || (log.type === 'debt' ? 'دين جديد' : log.type === 'payment' ? 'دفعة سداد' : 'فاتورة مشتريات');

      return `
        <div class="bg-white p-4 rounded-[22px] flex justify-between items-start gap-3 shadow-sm border-r-4 ${t.border}">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap mb-2">
              <span class="badge ${t.badge}"><i class="fas ${t.icon}"></i> ${t.text}</span>
              ${log.invoiceNumber ? `<span class="badge badge-slate">#${log.invoiceNumber}</span>` : ''}
            </div>
            <p class="text-sm font-bold text-slate-800">${note}</p>
            <p class="text-[11px] text-slate-400 mt-1">${formatDate(log.date)}</p>
            ${log.items && log.items.length ? `
              <div class="mt-3 p-3 rounded-2xl bg-slate-50 border border-slate-100">
                <div class="text-xs text-slate-500 mb-2">عناصر الفاتورة</div>
                <div class="space-y-1">
                  ${log.items.map(item => `
                    <div class="flex justify-between text-sm gap-3">
                      <span>${item.name} × ${item.qty}</span>
                      <span>${formatCurrency(item.total)}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>

          <div class="text-left shrink-0">
            <p class="font-extrabold ${t.cls}">${log.type === 'payment' ? '-' : '+'}${formatCurrency(log.amount).replace(' ' + state.settings.currency, '')}</p>
            <div class="flex gap-2 mt-2 justify-end">
              <button onclick="showEditLogModal('${customer.id}', '${log.id}')" class="text-[11px] px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600">تعديل</button>
              <button onclick="deleteLog('${customer.id}', '${log.id}')" class="text-[11px] px-3 py-1.5 rounded-full bg-red-50 hover:bg-red-100 text-red-600">حذف</button>
            </div>
          </div>
        </div>
      `;
    }

    function addCustomer() {
      const name = document.getElementById('customer-name')?.value?.trim();
      const phone = document.getElementById('customer-phone')?.value?.trim() || '';
      const creditLimit = parseNumber(document.getElementById('customer-credit-limit')?.value);
      const address = document.getElementById('customer-address')?.value?.trim() || '';
      const notes = document.getElementById('customer-notes')?.value?.trim() || '';

      if (!name) {
        showToast('اسم الزبون إجباري', 'error');
        return;
      }

      state.customers.push({
        id: uid('cust'),
        name,
        phone,
        address,
        notes,
        creditLimit: creditLimit || 0,
        createdAt: new Date().toISOString(),
        logs: []
      });

      save();
      closeModal();
      render();
      showToast('تم إضافة الزبون بنجاح', 'success');
    }

    function saveTransaction(type) {

        amount,
        note,
        date,
        createdAt: new Date().toISOString()

      closeModal();
      render();

    function addInvoiceItemRow(item = null) {
      const wrapper = document.getElementById('invoice-items');

      html.className = 'grid sm:grid-cols-12 gap-3 items-end';

          <label class="block text-xs font-bold text-slate-600 mb-1">السعر</label>
          <input type="number" min="0" step="0.01" class="input invoice-item-price" value="${item?.price || 0}" oninput="recalculateInvoiceTotal()">
        </div>

          <label class="block text-xs font-bold text-slate-600 mb-1">الإجمالي</label>

          <button onclick="removeInvoiceItemRow('${rowId}')" class="w-full h-[46px] rounded-2xl bg-red-50 hover:bg-red-100 text-red-600">

          </button>
        </div>
      `;
      wrapper.appendChild(html);
      recalculateInvoiceTotal();
    }

    function removeInvoiceItemRow(rowId) {
      document.getElementById(rowId)?.remove();
      recalculateInvoiceTotal();
    }

    function recalculateInvoiceTotal() {
      const rows = [...document.querySelectorAll('#invoice-items > div')];
      let total = 0;
      rows.forEach(row => {
        const qty = parseNumber(row.querySelector('.invoice-item-qty')?.value);
        const price = parseNumber(row.querySelector('.invoice-item-price')?.value);
        const rowTotal = qty * price;
        row.querySelector('.invoice-item-total').value = rowTotal.toFixed(2);
        total += rowTotal;
      });
      const totalEl = document.getElementById('invoice-total');
      if (totalEl) totalEl.innerText = formatCurrency(total);
    }

    function saveInvoice() {
      const customerId = document.getElementById('invoice-customer-id')?.value;
      const invoiceNumber = document.getElementById('invoice-number')?.value?.trim() || `INV-${Date.now()}`;
      const note = document.getElementById('invoice-note')?.value?.trim() || '';
      const date = document.getElementById('invoice-date')?.value ? new Date(document.getElementById('invoice-date').value).toISOString() : new Date().toISOString();

      if (!customerId) {
        showToast('اختر الزبون أولاً', 'error');
        return;
      }

      const customer = getCustomerById(customerId);
      if (!customer) return;

      const rows = [...document.querySelectorAll('#invoice-items > div')];
      const items = rows.map(row => {
        const name = row.querySelector('.invoice-item-name')?.value?.trim() || '';
        const qty = parseNumber(row.querySelector('.invoice-item-qty')?.value);
        const price = parseNumber(row.querySelector('.invoice-item-price')?.value);
        const total = qty * price;
        return { name, qty, price, total };
      }).filter(item => item.name && item.qty > 0);

      if (!items.length) {
        showToast('أضف عنصرًا واحدًا على الأقل في الفاتورة', 'error');
        return;
      }

      const totalAmount = items.reduce((a,b)=> a + b.total, 0);

      customer.logs.push({
        id: uid('log'),
        type: 'invoice',
        amount: totalAmount,
        note: note || 'فاتورة مشتريات',
        invoiceNumber,
        items,
        date,
        createdAt: new Date().toISOString()
      });

      save();
      closeModal();
      render();

      const balance = calculateBalance(customer);
      if (balance > getCreditLimit(customer)) {
        showToast(`تم حفظ الفاتورة، وتنبيه: ${customer.name} تجاوز الحد الائتماني`, 'warning', 3800);
      } else {
        showToast('تم حفظ الفاتورة بنجاح', 'success');
      }
    }

    function saveEditedLog(customerId, logId, isInvoice = false) {
      const customer = getCustomerById(customerId);
      if (!customer) return;
      const log = customer.logs.find(l => l.id === logId);
      if (!log) return;

      const amount = parseNumber(document.getElementById('edit-log-amount')?.value);
      const dateVal = document.getElementById('edit-log-date')?.value;
      const note = document.getElementById('edit-log-note')?.value?.trim() || '';

      if (amount <= 0) {
        showToast('أدخل مبلغًا صحيحًا', 'error');
        return;
      }

      if (!isInvoice) {
        log.type = document.getElementById('edit-log-type')?.value || log.type;
      } else {
        log.invoiceNumber = document.getElementById('edit-log-invoice-number')?.value?.trim() || log.invoiceNumber;
      }

      log.amount = amount;
      log.note = note;
      if (dateVal) log.date = new Date(dateVal).toISOString();

      save();
      closeModal();
      render();
      showToast('تم تعديل الحركة بنجاح', 'success');
    }

    function saveSettings() {
      state.settings.shopName = document.getElementById('set-shop-name').value.trim() || DEFAULT_SETTINGS.shopName;
      state.settings.currency = document.getElementById('set-currency').value.trim() || 'شيكل';
      state.settings.defaultCreditLimit = parseNumber(document.getElementById('set-default-credit-limit').value);
      state.settings.overdueDaysThreshold = parseNumber(document.getElementById('set-overdue-days').value) || 14;
      state.settings.shopPhone = document.getElementById('set-shop-phone').value.trim();
      state.settings.shopAddress = document.getElementById('set-shop-address').value.trim();
      state.settings.enableCreditLimitAlerts = document.getElementById('set-enable-credit-alert').checked;
      state.settings.enableOverdueAlerts = document.getElementById('set-enable-overdue-alert').checked;

      save();
      updateHeader();
      updateAlertsBadge();
      showToast('تم حفظ الإعدادات بنجاح', 'success');
      render();
    }

    function exportData() {
      const dataStr = JSON.stringify({
        customers: state.customers,
        settings: state.settings,
        exportedAt: new Date().toISOString(),
        version: 2
      }, null, 2);

      const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const fileName = `debts_backup_${new Date().toISOString().slice(0,10)}.json`;

      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();

      setTimeout(() => URL.revokeObjectURL(url), 500);
      showToast('تم تحميل النسخة الاحتياطية', 'success');
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';

      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = event => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.customers && imported.settings) {
              state.customers = imported.customers;
              state.settings = { ...DEFAULT_SETTINGS, ...imported.settings };
              save();
              render();
              updateHeader();
              updateAlertsBadge();
              showToast('تمت استعادة النسخة بنجاح', 'success');
            } else {
              showToast('ملف النسخة غير صالح', 'error');
            }
          } catch (err) {
            showToast('فشل في قراءة الملف', 'error');
          }
        };
        reader.readAsText(file);
      };

      input.click();
    }

      if (!customer) return;

      if (!customer.phone) {
        showToast('هذا الزبون لا يملك رقم هاتف', 'warning');
        return;
      }

      const balance = calculateBalance(customer);
      const text = `تحية من ${state.settings.shopName}
عزيزي ${customer.name}، رصيدك الحالي لدينا هو: ${balance} ${state.settings.currency}.
شكراً لتعاملكم معنا.`;

      const phone = customer.phone.replace(/[^\d]/g, '');
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    async function downloadCustomerPDF(custId) {
      const customer = getCustomerById(custId);
      if (!customer) return;

      const logs = filterLogs(customer.logs || []).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
      const balance = calculateBalance(customer);
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

      doc.setFontSize(16);
      doc.text(state.settings.shopName || 'Store', 105, 14, { align: 'center' });
      doc.setFontSize(11);
      doc.text(`Customer: ${customer.name}`, 14, 24);
      doc.text(`Phone: ${customer.phone || '-'}`, 14, 30);
      doc.text(`Credit Limit: ${getCreditLimit(customer)} ${state.settings.currency}`, 14, 36);
      doc.text(`Balance: ${balance} ${state.settings.currency}`, 14, 42);

      const body = logs.map(l => [
        new Date(l.date).toLocaleDateString(),
        l.type === 'debt' ? 'Debt' : l.type === 'payment' ? 'Payment' : 'Invoice',
        String(l.amount),
        l.note || '-',
        l.invoiceNumber || '-'
      ]);

      doc.autoTable({
        startY: 50,
        head: [['Date', 'Type', 'Amount', 'Note', 'Invoice #']],
        body,
        theme: 'striped',
        styles: { fontSize: 9, cellPadding: 2.5 },
        headStyles: { fillStyle: [29, 78, 216] }
      });

      doc.save(`${customer.name}_statement.pdf`);
      showToast('تم حفظ ملف PDF', 'success');
    }

      for (let i = 0; i < logs.length || i === 0; i += pageSize) {

    async function exportHTMLElementAsImage(htmlString, fileName = 'capture.png') {
      const root = document.getElementById('capture-root');
      root.innerHTML = htmlString;
      const element = root.firstElementChild;

      const canvas = await html2canvas(element, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true
      });

      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = fileName;
      a.click();

      root.innerHTML = '';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function toDatetimeLocal(dateStr) {
      const d = new Date(dateStr);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 16);
    }
